# Local development infrastructure for the VulnTrack API.
#   docker compose up -d
services:
  mongo:
    image: mongo:8.0
    # Single-node replica set: required for multi-document transactions.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017" # 27018 on the host avoids clashing with a locally installed MongoDB
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI
    profiles: ["mail"]

volumes:
  mongo-data:
